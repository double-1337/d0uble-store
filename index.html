
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>d0uble's 3D Models</title>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 24px 18px;
            background: #191820;
            color: #ffffff;
            font-family: Arial, sans-serif;
        }

        header {
            margin-bottom: 30px;
        }

        h1 {
            font-size: 25px;
            margin-bottom: 8px;
        }

        .accent {
            color: #a78bfa;
        }

        .subtitle {
            color: #aaa6b8;
            font-size: 14px;
        }

        .section-title {
            font-size: 19px;
            margin-bottom: 18px;
        }

        .product {
            background: #272531;
            border: 1px solid #393447;
            border-radius: 18px;
            padding: 15px;
            margin-bottom: 16px;
        }

        .preview {
            height: 170px;
            background: #373044;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 55px;
            margin-bottom: 15px;
        }

        .product h3 {
            margin: 0 0 8px;
            font-size: 18px;
        }

        .description {
            color: #aaa6b8;
            font-size: 14px;
        }

        .price {
            color: #c4b5fd;
            font-weight: bold;
            margin: 15px 0;
        }

        button {
            width: 100%;
            border: none;
            border-radius: 12px;
            padding: 14px;
            background: #8b5cf6;
            color: white;
            font-size: 15px;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <header>
        <h1>d0uble's <span class="accent">3D Models</span></h1>
        <div class="subtitle">
            Premium 3D models for creators
        </div>
    </header>

    <h2 class="section-title">🛒 Каталог моделей</h2>

    <div class="product">
        <div class="preview">🍔</div>

        <h3>Первая 3D-модель</h3>

        <div class="description">
            Качественная 3D-модель в ZIP-архиве.
        </div>

        <div class="price">⭐ 100 Stars</div>

        <button onclick="buyProduct()">
            Купить модель
        </button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        function buyProduct() {
            tg.sendData("buy_food");
        }
    </script>

</body>
</html>
